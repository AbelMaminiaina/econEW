# Docker Compose — démo « All » sur un VPS qui héberge déjà un autre site.
#
# - Projet Compose dédié (`all-demo`) : conteneurs, volumes et réseau préfixés `all-demo-`,
#   aucun conflit avec un autre projet Docker du serveur.
# - Aucun port 80/443 utilisé : l'application est exposée sur DEMO_PORT (8081 par défaut),
#   l'éventuel nginx d'un autre site n'est pas touché.
# - Postgres et Redis ne sont pas publiés sur l'hôte.
# - HTTPS optionnel sans domaine : service `tunnel` (Cloudflare Tunnel, profil `tunnel`) qui donne une
#   adresse https://xxxx.trycloudflare.com. Le site fonctionne sur n'importe quelle adresse (même
#   origine : API en /api, NextAuth déduit l'adresse des en-têtes X-Forwarded-*).
#
# Usage : docker compose -f docker-compose.demo.yml --env-file .env.demo up -d --build
name: all-demo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: all
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: all
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U all -d all"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://all:${POSTGRES_PASSWORD}@postgres:5432/all?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      FRONTEND_URL: ${PUBLIC_URL:?PUBLIC_URL requis}
      # Signe les sessions : obligatoire (sans elle le backend utiliserait une valeur de dev publique)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requis}
      PLATFORM_NAME: All
      # Compte administrateur créé par le seed
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@example.com}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD requis}
      # Paiement Mobile Money (vérifié manuellement) : seuls les numéros renseignés sont proposés
      PAYMENT_MVOLA_NUMBER: ${PAYMENT_MVOLA_NUMBER:-}
      PAYMENT_ORANGE_MONEY_NUMBER: ${PAYMENT_ORANGE_MONEY_NUMBER:-}
      PAYMENT_AIRTEL_MONEY_NUMBER: ${PAYMENT_AIRTEL_MONEY_NUMBER:-}
      PAYMENT_ACCOUNT_NAME: ${PAYMENT_ACCOUNT_NAME:-All}
      # Paiement automatique MVola (Merchant Pay) : laisser vide = paiement manuel par référence uniquement.
      # Voir MVOLA-INTEGRATION.md (identifiants à demander à MVola, validation en bac à sable avant la production).
      MVOLA_CONSUMER_KEY: ${MVOLA_CONSUMER_KEY:-}
      MVOLA_CONSUMER_SECRET: ${MVOLA_CONSUMER_SECRET:-}
      MVOLA_MERCHANT_NUMBER: ${MVOLA_MERCHANT_NUMBER:-}
      MVOLA_PARTNER_NAME: ${MVOLA_PARTNER_NAME:-}
      MVOLA_ENV: ${MVOLA_ENV:-sandbox}
      MVOLA_LANGUAGE: ${MVOLA_LANGUAGE:-FR}
      MVOLA_CALLBACK_URL: ${MVOLA_CALLBACK_URL:-}
      # Paiement automatique Orange Money (page de paiement d'Orange) et Airtel Money (demande sur le téléphone) :
      # laisser vide = paiement manuel. Voir OPERATEURS-INTEGRATION.md (bac à sable à valider avant la production).
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      # Paiement de DÉMONSTRATION : opérateurs simulés dans le backend (aucun argent réel). Jamais sur un vrai site.
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-false}
      ORANGE_MONEY_CLIENT_ID: ${ORANGE_MONEY_CLIENT_ID:-}
      ORANGE_MONEY_CLIENT_SECRET: ${ORANGE_MONEY_CLIENT_SECRET:-}
      ORANGE_MONEY_MERCHANT_KEY: ${ORANGE_MONEY_MERCHANT_KEY:-}
      ORANGE_MONEY_ENV: ${ORANGE_MONEY_ENV:-sandbox}
      AIRTEL_MONEY_CLIENT_ID: ${AIRTEL_MONEY_CLIENT_ID:-}
      AIRTEL_MONEY_CLIENT_SECRET: ${AIRTEL_MONEY_CLIENT_SECRET:-}
      AIRTEL_MONEY_ENV: ${AIRTEL_MONEY_ENV:-sandbox}
      # Commission de la plateforme sur les ventes des vendeurs (% du sous-total ; modifiable par vendeur dans /admin/reversements)
      PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-10}
      # Délai (en heures) avant l'annulation automatique d'une commande non payée (0 = jamais)
      UNPAID_ORDER_EXPIRY_HOURS: ${UNPAID_ORDER_EXPIRY_HOURS:-48}
      # E-mails (optionnel : sans SMTP, les envois sont simplement ignorés)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-savatry.milamina@gmail.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # API vue par le navigateur : chemin relatif (même origine que le site, via nginx). Fonctionne
        # aussi bien en http://IP:PORT que derrière le tunnel HTTPS, sans connaître l'adresse à l'avance.
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Appels serveur-à-serveur (NextAuth, SSR) : directement sur le backend, réseau interne
      BACKEND_URL: http://backend:3001
      # Pas de NEXTAUTH_URL : NextAuth déduit l'adresse publique des en-têtes X-Forwarded-* (nginx)
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET requis}
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${DEMO_PORT:-8081}:80"
    volumes:
      - ./nginx/all-demo.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  # Tunnel HTTPS Cloudflare (démarré avec --profile tunnel). L'adresse https://xxxx.trycloudflare.com
  # est affichée dans les logs et change à chaque recréation du conteneur (usage démo).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
